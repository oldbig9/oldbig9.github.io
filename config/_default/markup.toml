# -- Markup --
# 主题要求 unsafe=true 以渲染工具页的 raw HTML

[goldmark]
  [goldmark.renderer]
    unsafe = true
  [goldmark.parser]
    wrapStandAloneImageWithinParagraph = false
    [goldmark.parser.attribute]
      block = true

[highlight]
  noClasses = false

[tableOfContents]
  startLevel = 2
  endLevel = 4
